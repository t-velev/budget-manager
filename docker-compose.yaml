x-py-scripts-template: &python-base
    build:
      context: .
      dockerfile: python/Dockerfile
    image: python_src_base:latest
    profiles: ["manual"] # To not start with a general 'docker compose up'
    networks:
      - bm_network
    volumes:
      - ./src:/app/src
      - ./src:/opt/airflow/src
      - ./data:/app/data
    environment:
      # --- NOTION CONFIG ---
      NOTION_API_KEY:             ${NOTION_API_KEY}
      NOTION_DB_ID_YEAR:          ${NOTION_DB_ID_YEAR}
      NOTION_DB_ID_MONTH:         ${NOTION_DB_ID_MONTH}
      NOTION_DB_ID_CATEGORY:      ${NOTION_DB_ID_CATEGORY}
      NOTION_DB_ID_SUBCATEGORY:   ${NOTION_DB_ID_SUBCATEGORY}
      NOTION_DB_ID_BUDGET:        ${NOTION_DB_ID_BUDGET}
      NOTION_DB_ID_ACCOUNT:       ${NOTION_DB_ID_ACCOUNT}
      NOTION_DB_ID_TRANSACTION:   ${NOTION_DB_ID_TRANSACTION}
      # --- DATABASE CONFIG ---
      POSTGRES_USER:              ${POSTGRES_USER}
      POSTGRES_PASSWORD:          ${POSTGRES_PASSWORD}
      POSTGRES_DB:                ${POSTGRES_DB}
    depends_on:
      budget-db:
        condition: service_healthy

x-dbt-common: &dbt-common
  build:
    context: .
    dockerfile: dbt/Dockerfile
    target: dbt-postgres
  image: dbt-postgres:latest
  user: "${UID:-1000}:0"
  # Intercept the startup: set group-write permissions (umask 0002) then run dbt.
  # Needed for Airflow to have write permissions to write to the target folder (and others created by dbt as well)
  entrypoint: ["/bin/sh", "-c", "umask 0002 && exec dbt \"$$@\"", "--"]
  environment:
    &dbt-common-env
    DBT_PROFILES_DIR: /usr/app/dbt/budget_manager  # For dbt to store/look for profiles here
    DBT_PROJECT_DIR:  /usr/app/dbt/budget_manager  # For dbt to store/look for dbt_project.yml here
    # For DBT to see my project variables
    # --- NOTION CONFIG ---
    NOTION_API_KEY:             ${NOTION_API_KEY}
    NOTION_DB_ID_YEAR:          ${NOTION_DB_ID_YEAR}
    NOTION_DB_ID_MONTH:         ${NOTION_DB_ID_MONTH}
    NOTION_DB_ID_CATEGORY:      ${NOTION_DB_ID_CATEGORY}
    NOTION_DB_ID_SUBCATEGORY:   ${NOTION_DB_ID_SUBCATEGORY}
    NOTION_DB_ID_BUDGET:        ${NOTION_DB_ID_BUDGET}
    NOTION_DB_ID_ACCOUNT:       ${NOTION_DB_ID_ACCOUNT}
    NOTION_DB_ID_TRANSACTION:   ${NOTION_DB_ID_TRANSACTION}
    # --- DATABASE CONFIG ---
    POSTGRES_USER:              ${POSTGRES_USER}
    POSTGRES_PASSWORD:          ${POSTGRES_PASSWORD}
    POSTGRES_DB:                ${POSTGRES_DB}
    POSTGRES_HOST:              budget-db  # My existing budget manager DB container
  networks:
    - bm_network
  volumes:
    - ./dbt:/usr/app/dbt
  depends_on:
      budget-db:
        condition: service_healthy

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:3.1.7}
  environment:
    &airflow-common-env
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AF_POSTGRES_USER}:${AF_POSTGRES_PASSWORD}@airflow-db/${AF_POSTGRES_DB}
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__CORE__INTERNAL_API_SECRET_KEY: b3c07359b1d86bf033b7c0a6d1db929b9654d7939d95db82438b196b6d8005cd
    AIRFLOW__API_AUTH__JWT_SECRET: 8a1f2b3c4d5e6f7a8b9c0d1e2f3a4b5c8a1f2b3c4d5e6f7a8b9c0d1e2f3a4b5c

    # For Airflow to see my project variables
    # --- NOTION CONFIG ---
    NOTION_API_KEY:             ${NOTION_API_KEY}
    NOTION_DB_ID_YEAR:          ${NOTION_DB_ID_YEAR}
    NOTION_DB_ID_MONTH:         ${NOTION_DB_ID_MONTH}
    NOTION_DB_ID_CATEGORY:      ${NOTION_DB_ID_CATEGORY}
    NOTION_DB_ID_SUBCATEGORY:   ${NOTION_DB_ID_SUBCATEGORY}
    NOTION_DB_ID_BUDGET:        ${NOTION_DB_ID_BUDGET}
    NOTION_DB_ID_ACCOUNT:       ${NOTION_DB_ID_ACCOUNT}
    NOTION_DB_ID_TRANSACTION:   ${NOTION_DB_ID_TRANSACTION}
    # --- DATABASE CONFIG ---
    POSTGRES_USER:              ${POSTGRES_USER}
    POSTGRES_PASSWORD:          ${POSTGRES_PASSWORD}
    POSTGRES_DB:                ${POSTGRES_DB}
    POSTGRES_HOST:              budget-db  # My existing budget manager DB container
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/config:/opt/airflow/config
    - ./airflow/plugins:/opt/airflow/plugins
    - ./src:/opt/airflow/src
    - ./data:/opt/airflow/data
    - ./dbt:/opt/airflow/dbt    
  user: "${AIRFLOW_UID:-50000}:0"
  networks:
    - bm_network
  depends_on:
    airflow-db:
      condition: service_healthy


services:
# --- BUDGET MANAGER DATABASE ---
  budget-db:
    image: postgres:18
    container_name: budget_postgres
    networks:
      - bm_network
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pg_storage:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

# --- PYTHON SERVICES ---
  extract_and_load_year:
    <<: *python-base
    command: python src/extract_and_load_year.py
    container_name: extract_and_load_year

  extract_and_load_month:
    <<: *python-base
    command: python src/extract_and_load_month.py
    container_name: extract_and_load_month

  extract_and_load_category:
    <<: *python-base
    command: python src/extract_and_load_category.py
    container_name: extract_and_load_category

  extract_and_load_subcategory:
    <<: *python-base
    command: python src/extract_and_load_subcategory.py
    container_name: extract_and_load_subcategory

  extract_and_load_budget:
    <<: *python-base
    command: python src/extract_and_load_budget.py
    container_name: extract_and_load_budget

  extract_and_load_account:
    <<: *python-base
    command: python src/extract_and_load_account.py
    container_name: extract_and_load_account

  extract_and_load_transaction:
    <<: *python-base
    command: python src/extract_and_load_transaction.py
    container_name: extract_and_load_transaction

# --- AIRFLOW SERVICES ---
  airflow-db:
    image: postgres:17-alpine
    container_name: airflow_postgres
    volumes:
      - af_pg_storage:/var/lib/postgresql/data
    networks:
      - bm_network
    environment:
      POSTGRES_USER:     ${AF_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AF_POSTGRES_PASSWORD}
      POSTGRES_DB:       ${AF_POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AF_POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-api-server:
    <<: *airflow-common
    command: api-server
    container_name: airflow_webserver
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    container_name: airflow_scheduler
    restart: always

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    restart: always

  airflow-init:
    <<: *airflow-common
    profiles: ["setup"] # To not start with a general 'docker compose up'
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
      _PIP_ADDITIONAL_REQUIREMENTS: ''
    user: "0:0"

# --- DBT SERVICES ---
  dbt:
    <<: *dbt-common
    profiles: ["setup"] # To not start with a general 'docker compose up'
    environment:
      <<: *dbt-common-env

  dbt-docs:
      <<: *dbt-common
      command: docs serve --port 8082 --host 0.0.0.0  # --host 0.0.0.0 to allow Docker to route traffic to the port
      profiles: ["docs"]
      ports:
        - "8082:8082"

# --- MISC ---
networks:
  bm_network:
    driver: bridge

volumes:
  pg_storage:
  af_pg_storage:
