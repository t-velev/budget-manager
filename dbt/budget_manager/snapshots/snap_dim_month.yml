snapshots:
  - name: dim_month
    relation: ref('stg_month')
    config:
      schema: 03_dwh
      unique_key: month_id_bk
      check_cols:
        - month_id_bk
        - month_name
      post_hook:
        - "{{ create_pk('dk') }}"
        - "{{ apply_not_null('month_id_bk') }}"
        - "{{ apply_not_null('month_name') }}"
        - "{{ apply_not_null('created_time') }}"
        - "{{ apply_not_null('last_edited_time') }}"