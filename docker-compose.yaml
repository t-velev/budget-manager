x-py-scripts-template: &python-base
    build: .
    networks:
      - bm_network
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      
    environment:
      # --- NOTION CONFIG ---
      NOTION_API_KEY:             ${NOTION_API_KEY}
      NOTION_DB_ID_YEARS:         ${NOTION_DB_ID_YEARS}
      NOTION_DB_ID_MONTHS:        ${NOTION_DB_ID_MONTHS}
      NOTION_DB_ID_CATEGORIES:    ${NOTION_DB_ID_CATEGORIES}
      NOTION_DB_ID_SUBCATEGORIES: ${NOTION_DB_ID_SUBCATEGORIES}
      NOTION_DB_ID_BUDGETS:       ${NOTION_DB_ID_BUDGETS}
      NOTION_DB_ID_ACCOUNTS:      ${NOTION_DB_ID_ACCOUNTS}
      NOTION_DB_ID_INC_EXP:       ${NOTION_DB_ID_INC_EXP}

      # --- DATABASE CONFIG ---
      POSTGRES_USER:              ${POSTGRES_USER}
      POSTGRES_PASSWORD:          ${POSTGRES_PASSWORD}
      POSTGRES_DB:                ${POSTGRES_DB}

    depends_on:
      database:
        condition: service_healthy 

services:

  database:
    image: postgres:18
    container_name: postgres
    networks:
      - bm_network
    environment:
      POSTGRES_USER:              ${POSTGRES_USER}
      POSTGRES_PASSWORD:          ${POSTGRES_PASSWORD}
      POSTGRES_DB:                ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pg_storage:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5   

  extract_ntn_years:
    <<: *python-base
    command: python src/extract_ntn_years.py
    container_name: extract_ntn_years

  extract_ntn_inc_exp:
    <<: *python-base
    command: python src/extract_ntn_inc_exp.py
    container_name: extract_ntn_inc_exp
    
networks:
  bm_network:
    driver: bridge

volumes:
  pg_storage: 
    