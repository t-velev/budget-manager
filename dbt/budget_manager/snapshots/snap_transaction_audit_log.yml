snapshots:
  - name: transaction_audit_log
    relation: ref('stg_transaction')
    config:
      schema: 03_dwh
      unique_key: transaction_id_bk
      check_cols:
        - transaction_id_bk
        - transaction_name
        - transaction_type
        - transaction_date
        - transaction_amount
        - transaction_status
        - note
        - year_id
        - account_id
        - category_id
        - subcategory_id
      pre_hook:
        - "{{ drop_pk() }}"
      post_hook:
        - "{{ create_pk('dk') }}"        